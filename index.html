    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5649c4f2-7e76-4fdb-b134-687cf0e707c7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"83d88564-c07f-49ff-9cb4-9a8d63565be1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ----------------------------------------------------------\n     COLOURS — raw palette\n     Coral leads. Teal is reserved (Zolabs / data viz / second\n     accent). Background is warm cream, never pure white.\n     ---------------------------------------------------------- */\n\n  /* Primary */\n  --coral-50:  #FCEFE9;\n  --coral-100: #FAE0D4;\n  --coral-200: #F4C4AC;\n  --coral-300: #EFAE8E;\n  --coral-400: #E8967A;  /* PRIMARY — CTAs, accents, lane titles */\n  --coral-500: #D97C5E;  /* hover/press */\n  --coral-600: #BF6446;\n  --coral-700: #8E4A33;\n\n  /* Secondary accents */\n  --teal-100:   #DBF1EE;\n  --teal-300:   #B8E2DD;\n  --teal-500:   #8ECFCA;  /* Zolabs / data viz / 2nd accent */\n  --teal-700:   #4F948E;\n\n  --yellow-200: #FCE9A6;\n  --yellow-400: #F7C948;  /* warm yellow accent */\n  --yellow-600: #C99A21;\n\n  --peach-100:  #FDF1E8;\n  --peach-300:  #FAE8DC;  /* light peach surfaces */\n  --peach-500:  #F2CDB1;\n\n  /* Surfaces */\n  --cream:      #FDF8F4;  /* canvas / page background */\n  --cream-2:    #F7EFE6;  /* alt surface */\n  --paper:      #FFFFFF;  /* cards on cream — use sparingly */\n  --ink:        #1A1A1A;  /* warm black, body text */\n  --ink-2:      #2B2723;  /* near-black headings */\n  --grey-700:   #4A4441;\n  --grey-500:   #6B6360;  /* warm grey, secondary text */\n  --grey-300:   #B7AEA8;\n  --grey-200:   #D9CFC6;\n  --grey-100:   #ECE3D9;  /* hairlines, dividers */\n\n  /* Semantic (kept warm; no cold blues) */\n  --success:    #4F948E;\n  --warning:    #F7C948;\n  --danger:     #C45B3E;\n  --info:       #8ECFCA;\n\n  /* ----------------------------------------------------------\n     SEMANTIC TOKENS\n     ---------------------------------------------------------- */\n  --bg:         var(--cream);\n  --bg-alt:     var(--cream-2);\n  --bg-card:    var(--paper);\n  --bg-soft:    var(--peach-300);\n\n  --fg:         var(--ink);\n  --fg-1:       var(--ink);     /* primary text */\n  --fg-2:       var(--grey-500);/* secondary text */\n  --fg-3:       var(--grey-300);/* muted */\n  --fg-on-coral:#FFFFFF;\n  --fg-on-ink:  var(--cream);\n\n  --accent:     var(--coral-400);\n  --accent-strong: var(--coral-500);\n  --accent-soft: var(--coral-100);\n\n  --line:       var(--grey-100);\n  --line-strong:var(--grey-200);\n\n  /* ----------------------------------------------------------\n     TYPOGRAPHY\n     System: DM Sans (UI/body) + Instrument Serif (display, italic\n     for editorial accents) + Caveat (handwritten — pull quotes,\n     \"sound familiar?\" callouts, mirrors the EdZola wordmark).\n\n     NOTE — substitution: the EdZola wordmark itself is a custom\n     handwritten mark. We do not have the original font file.\n     Caveat is the closest free match. Replace if a custom face\n     is supplied.\n     ---------------------------------------------------------- */\n  --font-sans:    'DM Sans', 'Helvetica Neue', Arial, sans-serif;\n  --font-display: 'Instrument Serif', 'Source Serif Pro', Georgia, serif;\n  --font-hand:    'Caveat', 'Bradley Hand', cursive;\n  --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;\n\n  /* Type scale — modular, 1.2 ratio for body, 1.333 for display */\n  --fs-xs:   0.75rem;   /* 12 — captions, eyebrow */\n  --fs-sm:   0.875rem;  /* 14 — labels, fine print */\n  --fs-base: 1rem;      /* 16 — body */\n  --fs-md:   1.125rem;  /* 18 — lead paragraph */\n  --fs-lg:   1.375rem;  /* 22 */\n  --fs-xl:   1.75rem;   /* 28 — h4 */\n  --fs-2xl:  2.25rem;   /* 36 — h3 */\n  --fs-3xl:  3rem;      /* 48 — h2 */\n  --fs-4xl:  4rem;      /* 64 — h1 */\n  --fs-5xl:  5.5rem;    /* 88 — display / impact numbers */\n  --fs-6xl:  7.5rem;    /* 120 — full-bleed impact numbers */\n\n  --lh-tight:   1.05;\n  --lh-snug:    1.18;\n  --lh-normal:  1.45;\n  --lh-relaxed: 1.6;\n\n  --tracking-tight:  -0.02em;\n  --tracking-normal:  0;\n  --tracking-wide:    0.02em;\n  --tracking-eyebrow: 0.14em;\n\n  /* ----------------------------------------------------------\n     SPACING — 4pt base\n     ---------------------------------------------------------- */\n  --s-1:  4px;\n  --s-2:  8px;\n  --s-3:  12px;\n  --s-4:  16px;\n  --s-5:  20px;\n  --s-6:  24px;\n  --s-7:  32px;\n  --s-8:  40px;\n  --s-9:  56px;\n  --s-10: 72px;\n  --s-11: 96px;\n  --s-12: 128px;\n\n  /* ----------------------------------------------------------\n     RADII — rounded but never gummy. Pill for CTAs.\n     ---------------------------------------------------------- */\n  --r-xs:   4px;\n  --r-sm:   8px;\n  --r-md:   12px;\n  --r-lg:   18px;   /* cards */\n  --r-xl:   28px;   /* feature panels */\n  --r-2xl:  40px;\n  --r-pill: 999px;  /* CTA buttons */\n\n  /* ----------------------------------------------------------\n     ELEVATION — soft, warm shadows. No hard drops.\n     ---------------------------------------------------------- */\n  --shadow-1: 0 1px 2px rgba(58, 36, 22, 0.06);\n  --shadow-2: 0 4px 12px rgba(58, 36, 22, 0.08), 0 1px 2px rgba(58, 36, 22, 0.04);\n  --shadow-3: 0 12px 28px rgba(58, 36, 22, 0.10), 0 2px 6px rgba(58, 36, 22, 0.05);\n  --shadow-4: 0 24px 56px rgba(58, 36, 22, 0.14), 0 4px 12px rgba(58, 36, 22, 0.06);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 0 0 1px rgba(58, 36, 22, 0.04);\n\n  /* ----------------------------------------------------------\n     MOTION — calm and grounded. No bouncy springs.\n     ---------------------------------------------------------- */\n  --ease-out:    cubic-bezier(0.2, 0.7, 0.2, 1);\n  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:    140ms;\n  --dur-base:    220ms;\n  --dur-slow:    420ms;\n\n  /* Layout */\n  --max-w: 1240px;\n  --max-w-prose: 68ch;\n}\n\n/* ============================================================\n   ELEMENT DEFAULTS\n   ============================================================ */\nhtml, body {\n  background: var(--bg);\n  color: var(--fg-1);\n  font-family: var(--font-sans);\n  font-size: var(--fs-base);\n  line-height: var(--lh-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-display);\n  font-weight: 400;       /* Instrument Serif sits at 400 */\n  color: var(--ink-2);\n  letter-spacing: var(--tracking-tight);\n  line-height: var(--lh-tight);\n  margin: 0;\n}\nh1 { font-size: var(--fs-4xl); line-height: var(--lh-tight); }\nh2 { font-size: var(--fs-3xl); line-height: var(--lh-snug); }\nh3 { font-size: var(--fs-2xl); line-height: var(--lh-snug); }\nh4 { font-size: var(--fs-xl);  line-height: var(--lh-snug); }\nh5 { font-size: var(--fs-lg);  font-family: var(--font-sans); font-weight: 600; letter-spacing: var(--tracking-normal); }\nh6 { font-size: var(--fs-base);font-family: var(--font-sans); font-weight: 600; letter-spacing: var(--tracking-wide); text-transform: none; }\n\np  { margin: 0; line-height: var(--lh-relaxed); color: var(--fg-1); text-wrap: pretty; }\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--fs-xs);\n  font-weight: 600;\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--coral-500);\n}\n\n.lead {\n  font-size: var(--fs-md);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-2);\n  max-width: var(--max-w-prose);\n}\n\n.hand {\n  font-family: var(--font-hand);\n  font-weight: 500;\n  line-height: 1.1;\n}\n\n.display-italic {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-weight: 400;\n}\n\n.impact-number {\n  font-family: var(--font-display);\n  font-size: var(--fs-5xl);\n  line-height: 0.95;\n  letter-spacing: -0.03em;\n  color: var(--ink-2);\n}\n\ncode, kbd, samp {\n  font-family: var(--font-mono);\n  font-size: 0.9em;\n  background: var(--peach-300);\n  padding: 0.1em 0.35em;\n  border-radius: var(--r-xs);\n}\n\na {\n  color: var(--coral-500);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover { color: var(--coral-600); }\n\nhr {\n  border: 0;\n  border-top: 1px solid var(--line);\n  margin: var(--s-7) 0;\n}\n\n::selection { background: var(--coral-200); color: var(--ink); }\n<\u002Fstyle>\n<script src=\"6e2bdd36-3117-4cd3-8c79-a600cdcf15af\"><\u002Fscript>\n<style>\nbody{margin:0;background:#FDF8F4;color:#1A1A1A;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#BF6446;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}\na:hover{color:#8E4A33;text-decoration-thickness:2px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--cream);font-family:var(--font-sans);color:var(--ink)\">\n  <header style=\"position:sticky;top:0;z-index:10;height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(20px,5vw,56px);background:rgba(253,248,244,0.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--grey-100)\">\n    <img src=\"f1d8f8e0-200f-4f9b-8ccf-a6ec2d3f7c9d\" alt=\"EdZola\" style=\"height:30px;width:auto\">\n    <nav style=\"display:flex;align-items:center;gap:24px;font-size:14px;font-weight:500\">\n      <a href=\"#\" style=\"color:var(--grey-700);text-decoration:none\">Blog<\u002Fa>\n      <a href=\"#talk\" style=\"display:inline-flex;align-items:center;height:40px;padding:0 20px;border-radius:999px;background:var(--coral-400);color:#fff;text-decoration:none;font-weight:600\" style-hover=\"background:var(--coral-500)\">Talk to us<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <article style=\"max-width:720px;margin:0 auto;padding:clamp(56px,9vw,96px) clamp(20px,5vw,32px) 56px\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:24px\">\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--coral-600)\">AI Practice · Team<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1.05;letter-spacing:-0.02em;margin:0 0 28px;text-wrap:balance;color:var(--ink-2)\">From certification to capability: building an <em style=\"color:var(--coral-600)\">AI-ready<\u002Fem> team at EdZola<\u002Fh1>\n    <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:40px;border-bottom:1px solid var(--grey-100)\">\n      <div style=\"width:44px;height:44px;border-radius:50%;background:var(--peach-300);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--coral-700)\">P<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <span style=\"font-weight:600;font-size:15px\">Parthiban<\u002Fspan>\n        <span style=\"font-size:14px;color:var(--grey-500)\">6 October 2026 · 6 min read<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;font-size:18px;line-height:1.65;padding-top:40px;text-wrap:pretty\">\n      <p style=\"margin:0\">A few months ago, we started with a simple question at EdZola:<\u002Fp>\n      <p style=\"margin:8px 0;font-family:var(--font-display);font-style:italic;font-size:clamp(28px,4.4vw,36px);line-height:1.18;color:var(--ink-2)\">Why should the latest technology reach large enterprises first?<\u002Fp>\n      <p style=\"margin:0\">For years, new technology has often felt expensive, complex and out of reach for smaller organisations. Nonprofits and social-impact organisations, despite solving some of society's most important problems, can end up adopting these technologies much later.<\u002Fp>\n      <p style=\"margin:0\">We wanted to challenge that. We have seen organisations move:<\u002Fp>\n\n      <sc-if value=\"{{ showDiagrams }}\" hint-placeholder-val=\"{{ true }}\">\n        <figure style=\"margin:16px 0;padding:28px;border-radius:18px;background:var(--peach-300);display:flex;flex-direction:column;gap:20px\">\n          <figcaption style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--coral-700)\">How organisations have moved · 4 shifts<\u002Ffigcaption>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px\">\n            <div style=\"background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:var(--font-display);font-size:28px;color:var(--grey-500)\">01<\u002Fspan><span style=\"font-size:15px;font-weight:600\">Paper records<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:var(--font-display);font-size:28px;color:var(--grey-500)\">02<\u002Fspan><span style=\"font-size:15px;font-weight:600\">Spreadsheets<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:var(--font-display);font-size:28px;color:var(--grey-500)\">03<\u002Fspan><span style=\"font-size:15px;font-weight:600\">Digital systems<\u002Fspan><\u002Fdiv>\n            <div style=\"background:var(--coral-400);color:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:var(--font-display);font-size:28px\">04<\u002Fspan><span style=\"font-size:15px;font-weight:600\">AI<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Ffigure>\n      <\u002Fsc-if>\n\n      <p style=\"margin:0\">As AI becomes the next major shift in how organisations work, we don't want social-impact organisations to be left waiting for the technology to become \"accessible enough\" for them.<\u002Fp>\n      <p style=\"margin:0\">But there was another question we had to ask ourselves first:<\u002Fp>\n      <p style=\"margin:0;padding:4px 0 4px 0;font-weight:600;font-size:20px;color:var(--ink-2)\">If we want to help organisations adopt AI well, are we building enough capability within our own team to guide them?<\u002Fp>\n      <p style=\"margin:0\">That question became the starting point for our Claude certification journey.<\u002Fp>\n\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.6vw,40px);line-height:1.12;letter-spacing:-0.02em;margin:40px 0 0;color:var(--ink-2)\">It started with a requirement, but became something bigger<\u002Fh2>\n      <p style=\"margin:0\">As part of strengthening EdZola's relationship with the Claude Partner Network, certifications gave us a clear milestone to work towards. But we didn't want to approach them as boxes to tick.<\u002Fp>\n      <p style=\"margin:0\">For us, the bigger opportunity was to use the certification journey to strengthen our understanding of AI. Not just at the level of prompting a model, but understanding:<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 28px;font-size:17px\">\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How AI applications are designed<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How agents and workflows work<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How AI connects with external tools<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How MCP can be used<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How to choose the right model for the right use case<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How token usage affects the solution<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How to build guardrails<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Where human intervention is still important<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How to make AI applications more reliable<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0\">Since I was leading this initiative, I decided to go through the certification journey alongside the team. I didn't want my role to simply be coordinating exams, following up with people and tracking certifications.<\u002Fp>\n      <p style=\"margin:0\">I wanted to experience the same process:<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:17px\">\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Understand what the team was learning<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Understand where we were struggling<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Learn alongside them<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>See how that knowledge could translate into our actual work<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0\">So, we didn't begin by simply booking an exam. <strong style=\"font-weight:600\">We began by building a learning plan.<\u002Fstrong><\u002Fp>\n\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.6vw,40px);line-height:1.12;letter-spacing:-0.02em;margin:40px 0 0;color:var(--ink-2)\">Learning together, not studying alone<\u002Fh2>\n      <p style=\"margin:0\">We structured the journey over several weeks while everyone continued working on their regular client projects.<\u002Fp>\n      <p style=\"margin:0\">The preparation was not easy. Everyone was already involved in ongoing delivery work, so learning had to happen alongside project commitments. Some concepts were familiar. Many were completely new.<\u002Fp>\n      <p style=\"margin:0\">That made the way we learned even more important. Every week, we came together for reflection sessions. We:<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <span style=\"padding:8px 14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(58,36,22,0.06);font-size:15px\">Discussed what we had learned<\u002Fspan>\n        <span style=\"padding:8px 14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(58,36,22,0.06);font-size:15px\">Shared what we understood<\u002Fspan>\n        <span style=\"padding:8px 14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(58,36,22,0.06);font-size:15px\">Talked openly about what was still confusing<\u002Fspan>\n        <span style=\"padding:8px 14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(58,36,22,0.06);font-size:15px\">Shared mistakes and wrong answers<\u002Fspan>\n        <span style=\"padding:8px 14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(58,36,22,0.06);font-size:15px\">Ran quizzes<\u002Fspan>\n        <span style=\"padding:8px 14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(58,36,22,0.06);font-size:15px\">Took multiple mock tests<\u002Fspan>\n        <span style=\"padding:8px 14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(58,36,22,0.06);font-size:15px\">Learned from each other's understanding<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0\">There were plenty of wrong answers along the way. But those moments often became the most useful part of the learning.<\u002Fp>\n\n      <blockquote style=\"margin:24px 0;padding:0;display:flex;gap:20px;align-items:flex-start\">\n        <img src=\"5e4761d6-3885-40de-8801-0fd49984f16a\" alt=\"\" style=\"width:56px;height:56px;flex:none;margin-top:6px\">\n        <p style=\"margin:0;font-family:var(--font-display);font-style:italic;font-size:clamp(26px,4vw,34px);line-height:1.2;color:var(--ink-2)\">The goal was never to know the right answer once. It was to understand why it was the right answer.<\u002Fp>\n      <\u002Fblockquote>\n\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.6vw,40px);line-height:1.12;letter-spacing:-0.02em;margin:40px 0 0;color:var(--ink-2)\">From learning concepts to building with them<\u002Fh2>\n      <p style=\"margin:0\">We also knew that passing an exam alone would not tell us whether we could actually use what we had learned. That is where our internal AI hackathons became important.<\u002Fp>\n      <p style=\"margin:0\">Instead of keeping the concepts inside certification material, we started experimenting with them. The team:<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 28px;font-size:17px\">\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Built small prototypes<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Tried different AI workflows<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Experimented with agents<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Explored tool integrations<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Tested prompting approaches<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Applied certification concepts in practical situations<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0\">The question slowly changed from <em>\"Will this come in the exam?\"<\u002Fem> to <em>\"Where could we actually use this?\"<\u002Fem><\u002Fp>\n      <p style=\"margin:0\">That shift mattered. It helped connect:<\u002Fp>\n\n      <sc-if value=\"{{ showDiagrams }}\" hint-placeholder-val=\"{{ true }}\">\n        <figure style=\"margin:8px 0;padding:28px;border-radius:18px;background:var(--peach-300);display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n            <span style=\"padding:12px 20px;border-radius:999px;background:#fff;font-weight:600;font-size:16px\">Learning<\u002Fspan>\n            <span style=\"flex:1 1 24px;min-width:24px;height:1px;background:var(--coral-400)\"><\u002Fspan>\n            <span style=\"padding:12px 20px;border-radius:999px;background:#fff;font-weight:600;font-size:16px\">Experimentation<\u002Fspan>\n            <span style=\"flex:1 1 24px;min-width:24px;height:1px;background:var(--coral-400)\"><\u002Fspan>\n            <span style=\"padding:12px 20px;border-radius:999px;background:var(--coral-400);color:#fff;font-weight:600;font-size:16px\">Application<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Ffigure>\n      <\u002Fsc-if>\n\n      <p style=\"margin:0\">And that is where the certification journey became much more meaningful for us.<\u002Fp>\n\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.6vw,40px);line-height:1.12;letter-spacing:-0.02em;margin:40px 0 0;color:var(--ink-2)\">The first certification changed the energy<\u002Fh2>\n      <p style=\"margin:0\">When the first team member cleared the certification, it felt different from simply completing another milestone. It showed us that the process was working.<\u002Fp>\n      <p style=\"margin:0\">As more team members completed their certifications, what had started as a target connected to our partnership journey began to feel like the beginning of something much larger.<\u002Fp>\n      <p style=\"margin:0;font-weight:600;font-size:20px;color:var(--ink-2)\">We were building shared AI capability inside EdZola.<\u002Fp>\n\n      <sc-if value=\"{{ showDiagrams }}\" hint-placeholder-val=\"{{ true }}\">\n        <figure style=\"margin:16px 0;padding:28px;border-radius:18px;background:#fff;box-shadow:0 2px 8px rgba(58,36,22,0.07);display:flex;flex-direction:column;gap:20px\">\n          <figcaption style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--coral-700)\">The certification journey · 6 steps to shared capability<\u002Ffigcaption>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 16px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px solid var(--coral-200)\"><span style=\"font-family:var(--font-display);font-size:26px;color:var(--coral-600)\">1<\u002Fspan><span style=\"font-size:15px;font-weight:600;line-height:1.3\">A partnership requirement<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px solid var(--coral-200)\"><span style=\"font-family:var(--font-display);font-size:26px;color:var(--coral-600)\">2<\u002Fspan><span style=\"font-size:15px;font-weight:600;line-height:1.3\">A learning plan<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px solid var(--coral-300)\"><span style=\"font-family:var(--font-display);font-size:26px;color:var(--coral-600)\">3<\u002Fspan><span style=\"font-size:15px;font-weight:600;line-height:1.3\">Weekly reflection<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px solid var(--coral-400)\"><span style=\"font-family:var(--font-display);font-size:26px;color:var(--coral-600)\">4<\u002Fspan><span style=\"font-size:15px;font-weight:600;line-height:1.3\">Internal hackathons<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px solid var(--coral-600)\"><span style=\"font-family:var(--font-display);font-size:26px;color:var(--coral-600)\">5<\u002Fspan><span style=\"font-size:15px;font-weight:600;line-height:1.3\">Shared capability<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px solid var(--coral-700)\"><span style=\"font-family:var(--font-display);font-size:26px;color:var(--coral-600)\">6<\u002Fspan><span style=\"font-size:15px;font-weight:600;line-height:1.3\">Countless free &amp; selected paid mock exams<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Ffigure>\n      <\u002Fsc-if>\n\n      <p style=\"margin:0\">And that matters because we don't want AI knowledge to sit with one AI specialist, one developer, one product lead, or one small team.<\u002Fp>\n      <p style=\"margin:0\">We want people across EdZola to become comfortable asking better questions about AI:<\u002Fp>\n      <div style=\"padding:28px;border-radius:18px;background:var(--peach-300);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 28px;font-size:17px\">\n        <span>What can AI solve?<\u002Fspan>\n        <span>What should AI not solve?<\u002Fspan>\n        <span>Which model should we use?<\u002Fspan>\n        <span>How much autonomy should we give it?<\u002Fspan>\n        <span>Where do we need guardrails?<\u002Fspan>\n        <span>When should a human step in?<\u002Fspan>\n        <span>Is AI actually adding value here?<\u002Fspan>\n        <span>Is this the right solution for the organisation?<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0\">Certification gives us a foundation for those conversations. The real learning comes from what we do with it afterwards.<\u002Fp>\n\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.6vw,40px);line-height:1.12;letter-spacing:-0.02em;margin:40px 0 0;color:var(--ink-2)\">Why this matters beyond EdZola<\u002Fh2>\n      <p style=\"margin:0\">Ultimately, this journey connects back to the organisations we work with. A nonprofit should not need the budget of a large enterprise to benefit from good technology.<\u002Fp>\n      <p style=\"margin:0\">An organisation working with children, teachers, persons with disabilities, communities, livelihoods, healthcare or education should not have to wait years before technologies that already exist elsewhere become practical for them.<\u002Fp>\n      <p style=\"margin:0\">Of course, AI will not solve every problem. And introducing AI simply because it is the latest technology is not the goal either.<\u002Fp>\n      <p style=\"margin:0\">Our responsibility is to understand it well enough to recognise:<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:17px\">\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Where AI genuinely helps<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Where it does not<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>Where human judgement matters<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How it can be introduced responsibly<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--coral-400);flex:none;transform:translateY(-3px)\"><\u002Fspan><span>How it can create real value for an organisation<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0\">That begins with building those capabilities within our own team.<\u002Fp>\n\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.6vw,40px);line-height:1.12;letter-spacing:-0.02em;margin:40px 0 0;color:var(--ink-2)\">This is only the beginning<\u002Fh2>\n      <p style=\"margin:0\">Our Claude certifications are one milestone in that journey. There will be more learning, more certifications, more experiments, more hackathons, more prototypes, more real-world applications — and probably more things we get wrong before we understand them better.<\u002Fp>\n      <p style=\"margin:0\">But that is exactly the kind of learning culture we want to build.<\u002Fp>\n      <p style=\"margin:0\">For me, this certification journey was never only about earning a certificate. It was about building the confidence, skills and capability within our team to understand AI, experiment with it responsibly and turn that learning into useful solutions for social-impact organisations.<\u002Fp>\n      <p style=\"margin:0\">We started by asking: <em>Why should the latest technology reach large enterprises first?<\u002Fem><\u002Fp>\n\n      <div style=\"margin: 24px 0 0; padding: clamp(28px,5vw,40px); border-radius: 28px; color: var(--cream); display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; background-color: var(--cream)\">\n        <img src=\"aba742a8-b3a8-47cb-8a69-df58d0a34101\" alt=\"\" style=\"position:absolute;right:-18px;top:-18px;width:96px;height:96px\">\n        <p style=\"margin: 0; font-size: 18px; color: var(--teal-700); max-width: 52ch; font-weight: 100\">Our answer is not simply to give nonprofits access to AI.<\u002Fp>\n        <p style=\"margin:0;font-family:var(--font-display);font-size:clamp(28px,4.4vw,38px);line-height:1.15;max-width:22ch\">It is to build the knowledge, people and systems that can help them use it meaningfully.<\u002Fp>\n        <p style=\"margin:0;font-family:var(--font-hand);font-size:28px;color:var(--coral-300)\">And for us, this is just the beginning.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:56px;padding-top:32px;border-top:1px solid var(--grey-100);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <span style=\"padding:6px 12px;border-radius:12px;background:var(--peach-300);font-size:13px;font-weight:500;color:var(--coral-700)\">AI Practice<\u002Fspan>\n        <span style=\"padding:6px 12px;border-radius:12px;background:var(--peach-300);font-size:13px;font-weight:500;color:var(--coral-700)\">Claude Partner Network<\u002Fspan>\n        <span style=\"padding:6px 12px;border-radius:12px;background:var(--peach-300);font-size:13px;font-weight:500;color:var(--coral-700)\">Learning culture<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <section id=\"talk\" style=\"background:var(--peach-300);padding:clamp(56px,9vw,96px) clamp(20px,5vw,32px)\">\n    <div style=\"max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:20px\">\n      <span style=\"font-family:var(--font-hand);font-size:28px;color:var(--coral-600)\">Sound familiar?<\u002Fspan>\n      <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(32px,5vw,48px);line-height:1.08;letter-spacing:-0.02em;color:var(--ink-2);text-wrap:balance\">Wondering where AI fits in your programmes? Let's figure out what's right for you.<\u002Fh2>\n      <a href=\"https://www.edzola.com/contact\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;height:48px;padding:0 26px;border-radius:999px;background:var(--coral-400);color:#fff;text-decoration:none;font-weight:600;font-size:16px\" style-hover=\"background:var(--coral-500)\" style-active=\"background:var(--coral-600);transform:scale(0.98)\">Schedule a conversation<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:32px clamp(20px,5vw,56px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;font-size:14px;color:var(--grey-500)\">\n    <img src=\"f1d8f8e0-200f-4f9b-8ccf-a6ec2d3f7c9d\" alt=\"EdZola\" style=\"height:24px;width:auto\">\n    <span>Systems built for the world's hardest work.<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDiagrams&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { showDiagrams: this.props.showDiagrams ?? true };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
